name: Validate PR 5163 on latest upstream

on:
  push:
    branches:
      - "automation/validate-pr-5163-fowner-smoke"

permissions:
  contents: read

jobs:
  validate-rebased-head:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out rebased candidate
        uses: actions/checkout@v4
        with:
          ref: automation/rebase-pr-5163-69c160b
          fetch-depth: 0

      - name: Guard exact candidate and upstream base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "17ba86660b1add569b0565f163b71007acf21a0a"
          test "$(git rev-parse HEAD^)" = "69c160ba77518381dbbbe9b81f320a3672d6cf6e"
          git diff --check HEAD^
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/sandbox-image-smoke.yml \
            backend/docs/CONFIGURATION.md \
            backend/packages/harness/deerflow/community/aio_sandbox/local_backend.py \
            backend/tests/test_aio_sandbox_local_backend.py | sort)"
          test "$changed" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run offline sandbox regression suite
        working-directory: backend
        run: uv run pytest -m "not live" tests/test_aio_sandbox_local_backend.py -q

      - name: Resolve baseline and 1.11.0 smoke images
        shell: bash
        run: |
          set -euo pipefail
          resolve_image() {
            local source_ref="$1"
            local output_var="$2"
            local repo_digest
            docker pull "$source_ref" >/dev/null
            repo_digest="$(docker image inspect "$source_ref" --format '{{index .RepoDigests 0}}')"
            echo "$output_var=$repo_digest" >> "$GITHUB_ENV"
            echo "$output_var=$repo_digest"
          }
          resolve_image enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest DEER_FLOW_SANDBOX_SMOKE_IMAGE
          resolve_image enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0 DEER_FLOW_SANDBOX_FOWNER_SMOKE_IMAGE

      - name: Run both real-image smoke tests
        working-directory: backend
        run: uv run pytest -m live tests/test_aio_sandbox_local_backend.py -v
