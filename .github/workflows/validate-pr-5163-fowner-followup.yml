name: Stage validated PR 5163 FOWNER follow-up

on:
  push:
    branches:
      - "automation/validate-pr-5163-fowner-smoke"

permissions:
  contents: write

jobs:
  stage-validated-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: fix/5161-aio-fowner-cap
          fetch-depth: 0

      - name: Guard and recreate the already-validated patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fbba94fb3e32661d0e08935b876e09f9c13b6d3a"
          test "$(git rev-parse origin/automation/stage-pr-5163-fowner-followup)" = "fbba94fb3e32661d0e08935b876e09f9c13b6d3a"
          git show origin/automation/validate-pr-5163-fowner-smoke:.github/scripts/patch_pr_5163_fowner_followup.py > /tmp/patch_pr_5163_fowner_followup.py
          python /tmp/patch_pr_5163_fowner_followup.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/sandbox-image-smoke.yml \
            backend/docs/CONFIGURATION.md \
            backend/packages/harness/deerflow/community/aio_sandbox/local_backend.py \
            backend/tests/test_aio_sandbox_local_backend.py | sort)"
          test "$changed" = "$expected"

      - name: Stage non-workflow files and an exact workflow copy
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/sandbox-image-smoke.yml .pr5163-sandbox-image-smoke.yml.staged
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/docs/CONFIGURATION.md \
            backend/packages/harness/deerflow/community/aio_sandbox/local_backend.py \
            backend/tests/test_aio_sandbox_local_backend.py \
            .pr5163-sandbox-image-smoke.yml.staged
          git commit -m "chore: stage validated PR 5163 follow-up"
          git push origin HEAD:automation/stage-pr-5163-fowner-followup
