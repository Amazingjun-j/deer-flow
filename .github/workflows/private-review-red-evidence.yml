name: Private reviewer red evidence

on:
  push:
    branches:
      - validation/read-before-write-review-red

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
      - run: uv sync --group dev
      - run: uv run pytest -q tests/test_read_before_write_cancellation.py -k authorization_error
