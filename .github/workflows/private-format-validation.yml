name: Private format validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
      - run: uv sync --group dev
      - run: make format
      - name: Verify formatter produced no diff
        working-directory: .
        run: |
          git diff --check
          git diff --exit-code
      - run: make lint
      - name: Run focused read-before-write tests
        run: uv run pytest -q tests/test_read_before_write_cancellation.py tests/test_read_before_write_middleware.py
      - run: make test
