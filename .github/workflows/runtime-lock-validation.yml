name: Runtime lock validation

on:
  push:
    branches:
      - fix/runtime-thread-lock-reclamation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'
      - name: Apply tests and implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match in {path}: {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          helper = '''"""Event-loop-local keyed asyncio locks with deterministic idle cleanup."""

          from __future__ import annotations

          import asyncio
          import threading
          import weakref
          from collections.abc import AsyncIterator, Hashable
          from contextlib import asynccontextmanager
          from dataclasses import dataclass, field


          @dataclass(slots=True)
          class _LockEntry:
              lock: asyncio.Lock = field(default_factory=asyncio.Lock)
              participants: int = 0


          class AsyncKeyedLockTable[KeyT: Hashable]:
              """Serialize same-key coroutines without retaining idle keys."""

              def __init__(self) -> None:
                  self._guard = threading.Lock()
                  self._entries_by_loop: weakref.WeakKeyDictionary[
                      asyncio.AbstractEventLoop, dict[KeyT, _LockEntry]
                  ] = weakref.WeakKeyDictionary()

              @asynccontextmanager
              async def hold(self, key: KeyT) -> AsyncIterator[None]:
                  loop = asyncio.get_running_loop()
                  with self._guard:
                      entries = self._entries_by_loop.get(loop)
                      if entries is None:
                          entries = {}
                          self._entries_by_loop[loop] = entries
                      entry = entries.get(key)
                      if entry is None:
                          entry = _LockEntry()
                          entries[key] = entry
                      entry.participants += 1

                  try:
                      async with entry.lock:
                          yield
                  finally:
                      with self._guard:
                          entry.participants -= 1
                          entries = self._entries_by_loop.get(loop)
                          if entry.participants == 0 and entries is not None and entries.get(key) is entry:
                              entries.pop(key, None)
                              if not entries:
                                  self._entries_by_loop.pop(loop, None)

              def _entry_count(self, loop: asyncio.AbstractEventLoop | None = None) -> int:
                  if loop is None:
                      loop = asyncio.get_running_loop()
                  with self._guard:
                      entries = self._entries_by_loop.get(loop)
                      return len(entries) if entries is not None else 0
          '''
          Path('backend/packages/harness/deerflow/runtime/keyed_lock.py').write_text(helper, encoding='utf-8')

          replace_once(
              'backend/packages/harness/deerflow/runtime/goal.py',
              'import threading\nimport weakref\n',
              '',
          )
          replace_once(
              'backend/packages/harness/deerflow/runtime/goal.py',
              'from deerflow.models import create_chat_model\n',
              'from deerflow.models import create_chat_model\nfrom deerflow.runtime.keyed_lock import AsyncKeyedLockTable\n',
          )
          replace_once(
              'backend/packages/harness/deerflow/runtime/goal.py',
              '_goal_locks_guard = threading.Lock()\n_goal_locks_by_loop: weakref.WeakKeyDictionary[asyncio.AbstractEventLoop, dict[str, asyncio.Lock]] = weakref.WeakKeyDictionary()\n',
              '_goal_thread_locks = AsyncKeyedLockTable[str]()\n',
          )
          replace_once(
              'backend/packages/harness/deerflow/runtime/goal.py',
              '''@asynccontextmanager
          async def goal_thread_lock(thread_id: str) -> AsyncIterator[None]:
              """Serialize goal read-modify-write sequences within the current event loop."""
              loop = asyncio.get_running_loop()
              with _goal_locks_guard:
                  locks = _goal_locks_by_loop.get(loop)
                  if locks is None:
                      locks = {}
                      _goal_locks_by_loop[loop] = locks
                  lock = locks.get(thread_id)
                  if lock is None:
                      lock = asyncio.Lock()
                      locks[thread_id] = lock

              async with lock:
                  yield
          ''',
              '''@asynccontextmanager
          async def goal_thread_lock(thread_id: str) -> AsyncIterator[None]:
              """Serialize goal read-modify-write sequences within the current event loop."""
              async with _goal_thread_locks.hold(thread_id):
                  yield
          ''',
          )

          replace_once(
              'backend/packages/harness/deerflow/runtime/runs/worker.py',
              'from deerflow.runtime.context_keys import CURRENT_RUN_PRE_EXISTING_MESSAGE_IDS_KEY\n',
              'from deerflow.runtime.context_keys import CURRENT_RUN_PRE_EXISTING_MESSAGE_IDS_KEY\nfrom deerflow.runtime.keyed_lock import AsyncKeyedLockTable\n',
          )
          replace_once(
              'backend/packages/harness/deerflow/runtime/runs/worker.py',
              '_checkpoint_locks_guard = threading.Lock()\n_checkpoint_locks_by_loop: weakref.WeakKeyDictionary[asyncio.AbstractEventLoop, dict[str, asyncio.Lock]] = weakref.WeakKeyDictionary()\n',
              '_checkpoint_thread_locks = AsyncKeyedLockTable[str]()\n',
          )
          replace_once(
              'backend/packages/harness/deerflow/runtime/runs/worker.py',
              '''@asynccontextmanager
          async def _checkpoint_thread_lock(thread_id: str) -> AsyncIterator[None]:
              """Serialize checkpoint mutations for one thread without blocking goal commands."""
              loop = asyncio.get_running_loop()
              with _checkpoint_locks_guard:
                  locks = _checkpoint_locks_by_loop.get(loop)
                  if locks is None:
                      locks = {}
                      _checkpoint_locks_by_loop[loop] = locks
                  lock = locks.get(thread_id)
                  if lock is None:
                      lock = asyncio.Lock()
                      locks[thread_id] = lock

              async with lock:
                  yield
          ''',
              '''@asynccontextmanager
          async def _checkpoint_thread_lock(thread_id: str) -> AsyncIterator[None]:
              """Serialize checkpoint mutations for one thread without blocking goal commands."""
              async with _checkpoint_thread_locks.hold(thread_id):
                  yield
          ''',
          )

          tests = '''"""Regression tests for reclaimable runtime keyed locks."""

          from __future__ import annotations

          import asyncio
          from collections.abc import Callable
          from contextlib import AbstractAsyncContextManager

          import pytest

          from deerflow.runtime import goal as goal_runtime
          from deerflow.runtime.runs import worker as run_worker

          LockFactory = Callable[[str], AbstractAsyncContextManager[None]]

          CASES = (
              pytest.param(goal_runtime.goal_thread_lock, goal_runtime._goal_thread_locks, id='goal'),
              pytest.param(run_worker._checkpoint_thread_lock, run_worker._checkpoint_thread_locks, id='checkpoint'),
          )


          @pytest.mark.asyncio
          @pytest.mark.parametrize(('lock_factory', 'table'), CASES)
          async def test_idle_entries_are_reclaimed(lock_factory: LockFactory, table) -> None:
              for index in range(512):
                  async with lock_factory(f'completed-{index}'):
                      pass
              assert table._entry_count() == 0


          @pytest.mark.asyncio
          @pytest.mark.parametrize(('lock_factory', 'table'), CASES)
          async def test_waiter_cannot_be_bypassed(lock_factory: LockFactory, table) -> None:
              key = 'handoff'
              first_entered = asyncio.Event()
              release_first = asyncio.Event()
              second_entered = asyncio.Event()
              release_second = asyncio.Event()
              third_entered = asyncio.Event()

              async def first() -> None:
                  async with lock_factory(key):
                      first_entered.set()
                      await release_first.wait()

              async def second() -> None:
                  async with lock_factory(key):
                      second_entered.set()
                      await release_second.wait()

              async def third() -> None:
                  async with lock_factory(key):
                      third_entered.set()

              first_task = asyncio.create_task(first())
              await asyncio.wait_for(first_entered.wait(), 2)
              second_task = asyncio.create_task(second())
              await asyncio.sleep(0)
              release_first.set()
              await asyncio.wait_for(first_task, 2)
              third_task = asyncio.create_task(third())
              await asyncio.wait_for(second_entered.wait(), 2)
              await asyncio.sleep(0)
              assert not third_entered.is_set()
              release_second.set()
              await asyncio.wait_for(asyncio.gather(second_task, third_task), 2)
              assert table._entry_count() == 0


          @pytest.mark.asyncio
          @pytest.mark.parametrize(('lock_factory', 'table'), CASES)
          async def test_cancelled_waiter_checks_in(lock_factory: LockFactory, table) -> None:
              key = 'cancel'
              holder_entered = asyncio.Event()
              release_holder = asyncio.Event()

              async def holder() -> None:
                  async with lock_factory(key):
                      holder_entered.set()
                      await release_holder.wait()

              holder_task = asyncio.create_task(holder())
              await asyncio.wait_for(holder_entered.wait(), 2)
              waiter_task = asyncio.create_task(_hold_once(lock_factory, key))
              await asyncio.sleep(0)
              assert table._entry_count() == 1
              waiter_task.cancel()
              with pytest.raises(asyncio.CancelledError):
                  await waiter_task
              assert table._entry_count() == 1
              release_holder.set()
              await asyncio.wait_for(holder_task, 2)
              assert table._entry_count() == 0


          async def _hold_once(lock_factory: LockFactory, key: str) -> None:
              async with lock_factory(key):
                  pass


          @pytest.mark.asyncio
          @pytest.mark.parametrize(('lock_factory', 'table'), CASES)
          async def test_different_keys_remain_independent(lock_factory: LockFactory, table) -> None:
              release_first = asyncio.Event()
              first_entered = asyncio.Event()
              other_entered = asyncio.Event()

              async def first() -> None:
                  async with lock_factory('a'):
                      first_entered.set()
                      await release_first.wait()

              async def other() -> None:
                  async with lock_factory('b'):
                      other_entered.set()

              first_task = asyncio.create_task(first())
              await asyncio.wait_for(first_entered.wait(), 2)
              other_task = asyncio.create_task(other())
              await asyncio.wait_for(other_entered.wait(), 2)
              await other_task
              release_first.set()
              await first_task
              assert table._entry_count() == 0
          '''
          Path('backend/tests/test_runtime_thread_locks.py').write_text(tests, encoding='utf-8')

          p = Path('backend/packages/harness/deerflow/runtime/AGENTS.md')
          text = p.read_text(encoding='utf-8').rstrip()
          note = '''

          ### Event-loop keyed runtime locks

          `runtime/keyed_lock.py::AsyncKeyedLockTable` owns keyed `asyncio.Lock`
          registries used by goal and checkpoint mutation paths. It keeps locks
          event-loop-local and counts both the current holder and queued waiters
          before awaiting. Entries are reclaimed only after the final participant
          exits, including cancellation paths. Never delete an entry merely when a
          holder releases it: a queued waiter may still depend on the same lock and
          a newly-created lock would let a later caller bypass that waiter.
          '''
          if '### Event-loop keyed runtime locks' not in text:
              p.write_text(text + note, encoding='utf-8')
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --extra postgres
      - name: Verify focused tests
        working-directory: backend
        run: uv run pytest tests/test_runtime_thread_locks.py tests/test_goal_worker.py tests/test_run_duration_checkpoint.py tests/test_run_worker_delta_resume.py tests/test_run_worker_rollback.py tests/test_gateway_services.py -q
      - name: Format and lint
        working-directory: backend
        run: |
          make format
          make lint
      - name: Blocking I/O suite
        working-directory: backend
        run: make test-blocking-io
      - name: Full backend suite
        working-directory: backend
        run: make test
      - name: Publish validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-lock-validation.yml
          git diff --check 683d146a30411a743bf314866678f1bdae3944e6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): reclaim idle per-thread lock entries'
          git push origin HEAD:fix/runtime-thread-lock-reclamation
